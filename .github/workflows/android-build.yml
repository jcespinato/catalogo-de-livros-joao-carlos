name: Android build

on:
  push:
    paths:
      - ProjetoAndroid_Catalogo.zip
      - .github/workflows/android-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: |
          unzip -q ProjetoAndroid_Catalogo.zip
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          gradle -p CatalogoDeLivros :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CatalogoDeLivros-APK
          path: CatalogoDeLivros/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install -r CatalogoDeLivros/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n br.com.catalogodelivros/.MainActivity
            sleep 4
            mkdir -p capturas
            adb exec-out screencap -p > capturas/01_acesso_android.png
            tap_element() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb exec-out cat /sdcard/window.xml > capturas/window.xml
              coords=$(python3 - "$1" "$2" <<'PY'
            import re,sys,xml.etree.ElementTree as ET
            kind,value=sys.argv[1:]
            nodes=ET.parse('capturas/window.xml').iter('node')
            found=[n for n in nodes if (n.get('class')=='android.widget.EditText' if kind=='edit' else n.get('text')==value)]
            node=found[int(value)] if kind=='edit' else (found[0] if found else None)
            if node is None:sys.exit('Elemento não encontrado: '+value)
            x1,y1,x2,y2=map(int,re.findall(r'\d+',node.get('bounds')))
            print((x1+x2)//2,(y1+y2)//2)
            PY
              )
              adb shell input tap $coords
            }
            tap_element edit 0
            adb shell input text 'aluno@catalogo.local'
            adb shell input keyevent 4
            tap_element edit 1
            adb shell input text '123456'
            adb shell input keyevent 4
            tap_element text Entrar
            sleep 2
            adb exec-out screencap -p > capturas/02_catalogo_android.png
            tap_element text 'Ver detalhes'
            sleep 1
            adb exec-out screencap -p > capturas/03_detalhes_android.png
            tap_element text 'Adicionar ao carrinho'
            sleep 1
            tap_element text 'Abrir carrinho'
            sleep 1
            adb exec-out screencap -p > capturas/04_carrinho_android.png
            tap_element text 'Finalizar simulação'
            sleep 1
            adb exec-out screencap -p > capturas/05_aviso_android.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Capturas-Android
          path: capturas/*.png
