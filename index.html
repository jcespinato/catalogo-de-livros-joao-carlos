<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183b5b">
  <meta name="description" content="Catálogo de livros com busca por assunto, estoque e carrinho demonstrativo.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Catálogo de Livros</title>
  <style>
    :root { color-scheme: light; --ink:#1b2733; --blue:#183b5b; --line:#d7e0e8; --bg:#f3f6f9; --accent:#f6c65b; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #d99017;outline-offset:3px}
    .shell{max-width:760px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 45px #17334d12}
    header{background:var(--blue);color:#fff;padding:22px 24px 18px}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--blue);font-size:24px;font-weight:800}
    h1{font-size:23px;line-height:1.2;margin:0} .byline{font-size:13px;margin:6px 0 0;opacity:.9}
    main{padding:22px 24px 110px}.intro{margin:0 0 20px;color:#4f6170}
    h2{font-size:22px;line-height:1.25;margin:0 0 16px} h3{font-size:18px;margin:0 0 4px}
    .field{display:block;margin:14px 0 6px;font-weight:650}.text-input{width:100%;padding:13px 14px;border:1px solid #aebfcf;border-radius:10px;background:#fff;color:var(--ink)}
    .primary,.secondary,.text-button{border-radius:10px;padding:11px 16px;font-weight:700;min-height:44px}
    .primary{background:var(--blue);color:#fff;border:1px solid var(--blue)}.secondary{background:#fff;color:var(--blue);border:1px solid #94aac0}.text-button{background:transparent;color:var(--blue);border:0;padding:8px 3px;text-decoration:underline;text-underline-offset:3px}
    .stack{display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff;box-shadow:0 2px 10px #24394b08}
    .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.muted{color:#536777}.small{font-size:14px}.price{font-weight:800;white-space:nowrap;color:var(--blue)}.stock{font-size:14px;color:#365a74;margin:12px 0}
    .tag{display:inline-block;background:#e8eef4;color:#25445e;font-size:13px;font-weight:650;padding:4px 9px;border-radius:99px;margin:8px 0 0}
    .actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 20px #142e4a12;padding:7px 4px max(7px,env(safe-area-inset-bottom))}
    .bottom-nav button{border:0;background:none;color:#526778;padding:6px 2px;font-size:12px;font-weight:650;display:grid;justify-items:center;gap:1px;min-height:49px}
    .bottom-nav button[aria-current="page"]{color:var(--blue);background:#ebf2f8;border-radius:10px}.nav-icon{font-size:19px;line-height:1.2}
    .summary{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:16px 0;margin-top:16px;font-size:20px;font-weight:800}
    .notice{background:#edf3f8;border-left:4px solid var(--blue);padding:12px 14px;border-radius:4px;margin:16px 0;color:#30495e}
    .empty{border:1px dashed #aebfcf;padding:24px;border-radius:12px;text-align:center;color:#526778}
    .login{max-width:440px;margin:20px auto 0}.login .primary{width:100%;margin-top:20px}.error{color:#a6231d;font-weight:600;margin:10px 0}
    dialog{border:0;border-radius:18px;padding:22px;width:min(480px,calc(100% - 28px));box-shadow:0 18px 65px #10283f50;color:var(--ink)}dialog::backdrop{background:#10283f99}dialog h2{margin-right:30px}.close{position:absolute;top:12px;right:13px;background:transparent;border:0;font-size:25px;min-width:42px;min-height:42px;color:var(--blue)}
    @media(max-width:480px){header{padding:18px 18px 16px}main{padding:20px 16px 105px}h1{font-size:21px}.byline{line-height:1.4}.row{gap:9px}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand"><div class="brand-mark" aria-hidden="true">L</div><div><h1>Catálogo de Livros</h1><p class="byline" id="student">João Carlos de Souza Espinato · <time id="clock"></time></p></div></div></header>
  <main id="app" aria-live="polite"></main>
  <nav class="bottom-nav" id="nav" aria-label="Navegação principal" hidden></nav>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><button class="close" id="dialog-close" aria-label="Fechar">×</button><div id="dialog-content"></div></dialog>
<script src="app.js" defer></script>
</body>
</html>
